<body>
    <div class="frame">
        <div class="title">⚡ ESP32 3CH LIVE STREAM ⚡</div>
        <div id="errMsg" class="err-msg"></div>
        <div class="grid-3ch">
            <div class="ch-card" style="border-color:#f59e0b;">
                <div class="ch-title c1">🔵 CH1: SW1</div><div class="label" style="margin-bottom:8px;">DIGITAL INPUT</div>
                <span id="sw1Stat" class="status-huge release">RELEASE</span>
            </div>
            <div class="ch-card" style="border-color:#06b6d4;">
                <div class="ch-title c2">🟢 CH2: SW2</div><div class="label" style="margin-bottom:8px;">DIGITAL INPUT</div>
                <span id="sw2Stat" class="status-huge release">RELEASE</span>
            </div>
            <div class="ch-card" style="border-color:#d946ef;">
                <div class="ch-title c3">📶 CH3: RSSI</div><div class="label">SIGNAL</div>
                <div id="rssiDb" class="val-small" style="margin-bottom:16px;">--- dBm</div><span id="rssiStat" class="status-huge release" style="font-size:11px;">LIVE</span>
            </div>
        </div>
        <div class="noise-box">
            <div><div class="label" style="text-align:left;">POWER LINE MONITOR</div></div>
            <div id="noise" class="noise-val">--.- mV</div>
        </div>
        <div class="remote-box">
            <div class="label" style="color:#60a5fa;text-align:center;margin-bottom:8px;">REMOTE COMMAND TEST</div>
            <button id="ledBtn" class="btn-led" onclick="toggleRemoteLed()">SEND: LED ON</button>
        </div>
        <div class="sync-indicator"><span id="syncDot" class="dot"></span><span id="syncText">スキャン中...</span></div>
    </div>
    <script>
        const T_TEL="esp32_01/industrial/telemetry",T_CMD="esp32_01/industrial/command";
        let ledState=false,client=null;
        window.addEventListener('DOMContentLoaded',()=>{
            try{
                const p=new URLSearchParams(window.location.search),k=p.get('key');
                if(!k)throw new Error("URL引数(?key=)無し");
                const config=JSON.parse(atob(k));
                if(!config.url||!config.user||!config.pass)throw new Error("データ不正");
                document.getElementById("syncText").innerText="CONNECTING TO HIVEMQ...⚙️";
                client=mqtt.connect(`wss://${config.url}:8884/mqtt`,{username:config.user,password:config.pass});
                client.on('connect',()=>{
                    document.getElementById("syncDot").className="dot online";
                    document.getElementById("syncText").innerText="CONNECTED TO HIVEMQ CLOUD";
                    client.subscribe(T_TEL);
                });
                client.on('close',()=>{
                    document.getElementById("syncDot").className="dot";
                    document.getElementById("syncText").innerText="MQTT DISCONNECTED";
                });
                client.on('message',(t,m)=>{
                    if(t===T_TEL){
                        try{
                            const r=JSON.parse(m.toString());
                            
                            // 1. RSSI信号強度の処理
                            const rStat=document.getElementById("rssiStat"),rDb=document.getElementById("rssiDb");
                            if(Number(r.rssi_db)===0){
                                rDb.innerText="LAN (有線)";rStat.className="status-huge pressed";
                                rStat.style.background="#3b82f6";rStat.style.boxShadow="none";
                            }else{
                                rDb.innerText=Number(r.rssi_db)+" dBm";rStat.innerText="SIGNAL OK";
                                rStat.className="status-huge pressed";rStat.style.background="#10b981";
                            }
                            
                            // 2. アナログ値（LINE MONITOR）の処理（旧noise）
                            document.getElementById("noise").innerText=Number(r.sensor_mv).toFixed(1)+" mV";
                            document.getElementById("noise").style.color=Number(r.sensor_mv)>50.0?"#f59e0b":"#10b981";
                            
                            // 3. SW1（デジタル2値）のステータス処理
                            const s1=document.getElementById("sw1Stat");s1.innerText=r.sw1_stat;
                            if(r.sw1_stat==="PUSH"){
                                s1.className="status-huge pressed";s1.style.background="#f59e0b";s1.style.boxShadow="0 0 10px #f59e0b";
                            }else{
                                s1.className="status-huge release";s1.style.background="#374151";s1.style.boxShadow="none";
                            }
                            
                            // 4. SW2（デジタル2値）のステータス処理
                            const s2=document.getElementById("sw2Stat");s2.innerText=r.sw2_stat;
                            if(r.sw2_stat==="PUSH"){
                                s2.className="status-huge pressed";s2.style.background="#06b6d4";s2.style.boxShadow="0 0 10px #06b6d4";
                            }else{
                                s2.className="status-huge release";s2.style.background="#374151";s2.style.boxShadow="none";
                            }
                        }catch(e){console.error(e);}
                    }
                });
            }catch(e){
                document.getElementById("syncText").innerText="接続エラー";
                const err=document.getElementById("errMsg");err.style.display="block";err.innerText="⚠️ エラー: "+e.message;
            }
        });
        function toggleRemoteLed(){
            ledState=!ledState;const btn=document.getElementById("ledBtn");
            btn.innerText=ledState?"SEND: LED OFF":"SEND: LED ON";
            btn.className=btn.className.includes("active")?"btn-led":"btn-led active";
            if(client&&client.connected){client.publish(T_CMD,ledState?"1" : "0");}
            else{alert("MQTTサーバーに接続されていません。");}
        }
    </script>
</body>
