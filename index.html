<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 INDUSTRIAL PANEL</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { background: #0b0f19; color: #f3f4f6; font-family: 'Courier New', monospace; padding: 10px; margin: 0; }
        .frame { border: 2px solid #10b981; padding: 15px; border-radius: 8px; max-width: 420px; margin: 10px auto; background: #111827; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); box-sizing: border-box; }
        .title { color: #10b981; font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #1f2937; padding-bottom: 5px; text-align: center; }
        .grid-3ch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .ch-card { background: #111827; border: 1px solid #4b5563; padding: 10px; border-radius: 6px; text-align: center; }
        .ch-title { font-size: 11px; font-weight: bold; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #1f2937; }
        .c1 { color: #f59e0b; border-color: #f59e0b; }
        .c2 { color: #06b6d4; border-color: #06b6d4; }
        .c3 { color: #10b981; border-color: #10b981; }
        .label { color: #9ca3af; font-size: 11px; margin-bottom: 2px; text-align: center; }
        .val-small { font-size: 14px; font-weight: bold; color: #ffffff; margin-bottom: 8px; }
        
        /* 📐 縦位置のガタつきを徹底排除する固定ライン設定 */
        .status-huge { 
            display: block; 
            width: 85%; 
            height: 26px;        /* 縦幅を強制固定 */
            line-height: 26px;   /* 文字の上下位置を中央にロック */
            margin: 0 auto; 
            font-size: 11px; 
            font-weight: bold; 
            border-radius: 4px; 
            text-transform: uppercase; 
            text-align: center; 
            box-sizing: border-box; 
        }
        
        .status-huge.pressed { background: #10b981; color: #ffffff; animation: pulse 0.6s infinite alternate; }
        .status-huge.release { background: #374151; color: #9ca3af; }
        .remote-box { background: #111c2e; border: 1px solid #1e3a8a; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .btn-led { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: #ffffff; background: #3b82f6; border: none; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 0px #1d4ed8; transition: 0.1s; text-align: center; }
        .btn-led:active { transform: translateY(4px); box-shadow: none; }
        .btn-led.active { background: #10b981; box-shadow: 0 4px 0px #059669; }
        .sync-indicator { text-align: center; font-size: 11px; color: #6b7280; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #fbbf24; display: inline-block; }
        .dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.04); } }
        .err-msg { color: #f59e0b; text-align: center; font-size: 12px; margin: 10px; display: none; }
        .db-box { background: #0d1117; border: 1px dashed #3b82f6; padding: 10px; border-radius: 6px; margin-top: 15px; box-sizing: border-box; }
        .db-title { font-size: 11px; color: #3b82f6; font-weight: bold; margin-bottom: 8px; text-align: center; border-bottom: 1px dashed #1e3a8a; padding-bottom: 4px; }
        .debug-panel { background: #1a1505; border: 1px solid #eab308; padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 9px; color: #fef08a; box-sizing: border-box; }
        .debug-title { color: #eab308; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #854d0e; padding-bottom: 4px; font-size: 10px; }
        .debug-line { margin-bottom: 6px; word-break: break-all; line-height: 1.4; }
        .debug-alert { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>
    <div class="frame">
        <div class="title">⚡ ESP32 3CH LIVE STREAM ⚡</div>
        <div id="errMsg" class="err-msg"></div>
        
        <div class="grid-3ch">
            <div class="ch-card c1">
                <div class="ch-title">🔵 CH1: SW1</div>
                <div class="label" style="margin-bottom:8px;">DIGITAL INPUT</div>
                <!-- 📐 CH3のmV行と高さを合わせるための透明スペーサー -->
                <div style="height:22px;"></div>
                <span id="sw1Stat" class="status-huge release">RELEASE</span>
            </div>
            <div class="ch-card c2">
                <div class="ch-title">🟢 CH2: SW2</div>
                <div class="label" style="margin-bottom:8px;">DIGITAL INPUT</div>
                <!-- 📐 CH3のmV行と高さを合わせるための透明スペーサー -->
                <div style="height:22px;"></div>
                <span id="sw2Stat" class="status-huge release">RELEASE</span>
            </div>
            <!-- 🟢 CH3: アナログ監視（高さを自動で他と同期） -->
            <div class="ch-card c3" id="ch3Card">
                <div class="ch-title">⚡ CH3: ANALOG</div>
                <div class="label" style="margin-bottom:8px;">ANALOG INPUT</div>
                <div id="noiseDb" class="val-small">--.- mV</div>
                <span id="noiseStat" class="status-huge release" style="font-size:11px;">SAFE</span>
            </div>
        </div>

        <div class="remote-box">
            <div class="label" style="color:#60a5fa;text-align:center;margin-bottom:8px;">REMOTE COMMAND TEST</div>
            <button id="ledBtn" class="btn-led" onclick="toggleRemoteLed()">SEND: LED ON</button>
        </div>

        <div class="db-box">
            <div class="db-title">🛢️ SUPABASE CLOUD ARCHIVE (LATEST 3)</div>
            <div id="dbLogs"><div style="text-align:center;font-size:10px;color:#6b7280;">一時停止中 (EMQXテスト優先)</div></div>
        </div>

        <div class="debug-panel">
            <div class="debug-title">🛠️ LIVE SYSTEM DIAGNOSTIC CONSOLE</div>
            <div id="debugConsole" class="debug-line">ログ解析中...</div>
            <div id="dbgArgs" class="debug-line" style="border-top:1px dashed #854d0e;padding-top:6px;margin-top:6px;">引数データ: 読込中...</div>
        </div>

        <div class="sync-indicator">
            <span id="syncDot" class="dot"></span>
            <span id="syncText">スキャン中...</span>
            <span id="netStatus" style="color:#6b7280; margin-left: 10px; border-left: 1px solid #374151; padding-left: 10px;">---</span>
        </div>
    </div>
  <script>
        const T_TEL = "esp32_01/industrial/telemetry", T_CMD = "esp32_01/industrial/command";
        let ledState = false, client = null, l_url = "", l_user = "", l_pass = "";
        let sb_url = "", sb_key = ""; 

        function addDebugLog(msg, isError = false) {
            const consoleEl = document.getElementById("debugConsole");
            consoleEl.innerHTML += `<div ${isError ? 'class="debug-alert"' : ''}>・${msg}</div>`;
    
            while (consoleEl.children.length > 5) {
                consoleEl.removeChild(consoleEl.firstChild);
            }
        }
        window.addEventListener('DOMContentLoaded', () => {
            try {
                addDebugLog("URL引数の解析を開始します...🔍");
                let k = new URLSearchParams(window.location.search).get('key');
                if (!k) throw new Error("URL引数(?key=)無し");
                
                const globalConfig = JSON.parse(atob(k.replace(/[\r\n]/g, '').trim()));
                l_url = globalConfig.url; l_user = globalConfig.user; l_pass = globalConfig.pass;
                sb_url = globalConfig.sb_url || "";
                sb_key = globalConfig.sb_key || "";
                
                if (!l_url || !l_user || !l_pass) throw new Error("データ不正: 設定不足");
                
                addDebugLog("Base64の解読に成功しました。");
                document.getElementById("dbgArgs").innerHTML = "【システム引数】認証保護により非表示（暗号トークン検証クリア）";
                startMqttConnection();
            } catch(e) {
                addDebugLog("初期化エラー: " + e.message, true);
                const err = document.getElementById("errMsg");
                err.style.cssText = "color:#f59e0b; display:block;";
                err.innerText = "⚠️ エラー: " + e.message;
            }
        });

        function startMqttConnection() {
            addDebugLog("【STEP1】EMQXへのログインを開始（ポート:8084）...⚙️");
            document.getElementById("syncText").innerText = "CONNECTING...";
            
            client = mqtt.connect(`wss://${l_url}:8084/mqtt`, {
                username: l_user, password: l_pass,
                clientId: 'web_panel_' + Math.random().toString(16).substr(2, 8),
                connectTimeout: 5000, clean: true, rejectUnauthorized: false
            });
            
            client.on('connect', () => {
                document.getElementById("syncDot").className = "dot online";
                document.getElementById("syncText").innerText = "CONNECTED";
                addDebugLog("<span style='color:#10b981;font-weight:bold;'>→ EMQX接続成功！通信ラインを確保🟢</span>");
                client.subscribe(T_TEL);
                
                fetchSupabaseLogs(); 
                setInterval(fetchSupabaseLogs, 10000);
            });

            client.on('close', () => {
                document.getElementById("syncDot").className = "dot";
                document.getElementById("syncText").innerText = "DISCONNECTED";
                document.getElementById("netStatus").innerText = "---";
                document.getElementById("netStatus").style.color = "#6b7280";
            });

            client.on('error', (err) => addDebugLog("→ EMQX接続エラー: " + (err.message || "failed"), true));

            client.on('message', (t, m) => {
                if (t !== T_TEL) return;
                try {
                    const r = JSON.parse(m.toString());
                    
                    // 🔄 最下部インジケーター横のネットワーク表示ロジック
                    const isEth = Number(r.rssi_db) === 0;
                    const netStatusEl = document.getElementById("netStatus");
                    if (isEth) {
                        netStatusEl.innerText = "LAN (有線)";
                        netStatusEl.style.color = "#3b82f6"; // 青色
                    } else {
                        netStatusEl.innerText = "RSSI: " + Number(r.rssi_db) + " dBm";
                        netStatusEl.style.color = "#10b981"; // WiFi接続時はオンラインを示す緑色
                    }

                    // 🔄 CH3（ノイズ専用）の更新処理
                    const noise = Number(r.noise_mv);
                    const noiseDbEl = document.getElementById("noiseDb");
                    const noiseStatEl = document.getElementById("noiseStat");
                    const ch3CardEl = document.getElementById("ch3Card");
                    
                    noiseDbEl.innerText = noise.toFixed(1) + " mV";
                    
                    if (noise > 50.0) {
                        ch3CardEl.style.borderColor = "#f59e0b";
                        ch3CardEl.style.color = "#f59e0b";
                        noiseStatEl.innerText = "WARN";
                        noiseStatEl.className = "status-huge pressed";
                        noiseStatEl.style.cssText = "background: #f59e0b; box-shadow: 0 0 10px #f59e0b; font-size:11px;";
                    } else {
                        ch3CardEl.style.borderColor = "#10b981";
                        ch3CardEl.style.color = "#10b981";
                        noiseStatEl.innerText = "SAFE";
                        noiseStatEl.className = "status-huge release";
                        noiseStatEl.style.cssText = "background: #374151; box-shadow: none; font-size:11px;";
                    }
                    
                    const updateSwitch = (id, stat, activeColor) => {
                        const el = document.getElementById(id);
                        el.innerText = stat;
                        const isPush = stat === "PUSH";
                        el.className = `status-huge ${isPush ? 'pressed' : 'release'}`;
                        el.style.cssText = isPush ? `background: ${activeColor}; box-shadow: 0 0 10px ${activeColor};` : "background: #374151; box-shadow: none;";
                    };
                    
                    updateSwitch("sw1Stat", r.sw1_stat, "#f59e0b");
                    updateSwitch("sw2Stat", r.sw2_stat, "#06b6d4");
                } catch(e) { console.error(e); }
            });
        }

        async function fetchSupabaseLogs() {
            if (!sb_url || !sb_key) return;
            try {
                const cleanUrl = sb_url.endsWith('/') ? sb_url.slice(0, -1) : sb_url;
                
                const res = await fetch(`${cleanUrl}/rest/v1/esp32_telemetry?select=*&order=created_at.desc&limit=1`, {
                    method: "GET",
                    headers: {
                        "apikey": sb_key,
                        "Authorization": `Bearer ${sb_key}`,
                        "Content-Type": "application/json",
                        "Accept": "application/json",
                        "Cache-Control": "no-store, no-cache, must-revalidate",
                        "Pragma": "no-cache"
                    }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const dataArray = await res.json();
                const container = document.getElementById("dbLogs");
                
                if (!dataArray || dataArray.length === 0) {
                    container.innerHTML = `<div style="text-align:center;font-size:10px;color:#6b7280;">データがありません</div>`;
                    return;
                }

                const log = dataArray;
                const jstTime = new Date(log.created_at).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
                
                container.innerHTML = `
                    <div class="log-item" style="font-size:10px; color:#cbd5e1; background:#161b22; padding:8px; border-radius:4px; border-left:3px solid #3b82f6; line-height:1.5;">
                        <span class="log-time" style="color:#38bdf8; font-weight:bold;">[${jstTime} JST]</span><br>
                        ID        : <span style="color:#ffffff; font-weight:bold;">${log.id}</span><br>
                        MAC       : ${log.mac}<br>
                        SW1_STAT  : <span style="color:#f59e0b; font-weight:bold;">${log.sw1_stat}</span> (EDGE:${log.sw1_edge})<br>
                        SW2_STAT  : <span style="color:#06b6d4; font-weight:bold;">${log.sw2_stat}</span> (EDGE:${log.sw2_edge})<br>
                        RSSI      : ${log.rssi_db} dBm<br>
                        LINE NOISE: <span style="color:#10b981;">${Number(log.noise_mv).toFixed(1)} mV</span>
                    </div>
                `;
                
                addDebugLog("<span style='color:#38bdf8;'>→ Supabase本番ログテーブルの同期に成功！📊</span>");

            } catch(e) {
                console.error("Supabase Fetch Error:", e);
                addDebugLog("❌ Supabase同期エラー: " + e.message, true);
            }
        }
        
        function toggleRemoteLed() {
            ledState = !ledState;
            const btn = document.getElementById("ledBtn");
            btn.innerText = ledState ? "SEND: LED OFF" : "SEND: LED ON";
            btn.className = `btn-led ${ledState ? 'active' : ''}`;
            if (client && client.connected) client.publish(T_CMD, ledState ? "1" : "0");
            else alert("MQTTサーバーに接続されていません。");
        }
    </script>
</body>
</html>
