<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>ESP32 INDUSTRIAL PANEL</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body{background:#0b0f19;color:#f3f4f6;font-family:'Courier New',monospace;padding:10px;margin:0;}
        .frame{border:2px solid #10b981;padding:15px;border-radius:8px;max-width:390px;margin:10px auto;background:#111827;box-shadow:0 4px 6px -1px rgba(0,0,0,0.5);box-sizing:border-box;}
        .title{color:#10b981;font-size:16px;font-weight:bold;margin-bottom:15px;border-bottom:1px solid #1f2937;padding-bottom:5px;text-align:center;}
        .grid-3ch{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px;}
        .ch-card{background:#111827;border:1px solid #4b5563;padding:8px 4px;border-radius:6px;text-align:center;}
        .ch-title{font-size:10px;font-weight:bold;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #1f2937;}
        .c1{color:#f59e0b;border-color:#f59e0b;}.c2{color:#06b6d4;border-color:#06b6d4;}.c3{color:#d946ef;border-color:#d946ef;}
        .label{color:#9ca3af;font-size:10px;margin-bottom:2px;}
        .val-small{font-size:14px;font-weight:bold;color:#ffffff;margin-bottom:8px;}
        .status-huge{display:block;width:90%;margin:0 auto;padding:6px 0;font-size:11px;font-weight:bold;border-radius:4px;text-transform:uppercase;text-align:center;}
        .status-huge.pressed{background:#10b981;color:#ffffff;animation:pulse 0.6s infinite alternate;}
        .status-huge.release{background:#374151;color:#9ca3af;}
        .noise-box{display:flex;justify-content:space-between;align-items:center;background:#1f2937;padding:12px;border-radius:6px;margin-bottom:15px;border:1px solid #374151;}
        .noise-val{font-size:18px;font-weight:bold;color:#10b981;}
        .remote-box{background:#111c2e;border:1px solid #1e3a8a;padding:12px;border-radius:6px;margin-bottom:15px;}
        .btn-led{width:100%;padding:12px;font-size:14px;font-weight:bold;color:#ffffff;background:#3b82f6;border:none;border-radius:6px;cursor:pointer;box-shadow:0 4px 0px #1d4ed8;transition:0.1s;text-align:center;}
        .btn-led:active{transform:translateY(4px);box-shadow:none;}.btn-led.active{background:#10b981;box-shadow:0 4px 0px #059669;}
        .sync-indicator{text-align:center;font-size:10px;color:#6b7280;margin-top:15px;display:flex;align-items:center;justify-content:center;gap:6px;}
        .dot{width:8px;height:8px;border-radius:50%;background:#fbbf24;display:inline-block;}.dot.online{background:#10b981;box-shadow:0 0 8px #10b981;}
        @keyframes pulse{from{transform:scale(1);}to{transform:scale(1.02);}}
        .err-msg{color:#f59e0b;text-align:center;font-size:11px;margin:10px;display:none;}
        .db-box{background:#0d1117;border:1px dashed #3b82f6;padding:10px;border-radius:6px;margin-top:15px;box-sizing:border-box;}
        .db-title{font-size:11px;color:#3b82f6;font-weight:bold;margin-bottom:8px;text-align:center;border-bottom:1px dashed #1e3a8a;padding-bottom:4px;}
        .log-item{font-size:10px;color:#cbd5e1;background:#161b22;padding:6px;border-radius:4px;margin-bottom:6px;border-left:3px solid #3b82f6;line-height:1.5;word-break:break-all;white-space:normal;}
        .log-time{color:#38bdf8;font-weight:bold;}.log-edge{color:#f59e0b;font-weight:bold;}
    </style>
</head>
<body>
    <div class="frame">
        <div class="title">⚡ ESP32 3CH LIVE STREAM ⚡</div>
        <div id="errMsg" class="err-msg"></div>
        <div class="grid-3ch">
            <div class="ch-card" style="border-color:#f59e0b;">
                <div class="ch-title c1">🔵 CH1: SW1</div><div class="label" style="margin-bottom:8px;">DIGITAL INPUT</div>
                <span id="sw1Stat" class="status-huge release">RELEASE</span>
            </div>
            <div class="ch-card" style="border-color:#06b6d4;">
                <div class="ch-title c2">🟢 CH2: SW2</div><div class="label" style="margin-bottom:8px;">DIGITAL INPUT</div>
                <span id="sw2Stat" class="status-huge release">RELEASE</span>
            </div>
            <div class="ch-card" style="border-color:#d946ef;">
                <div class="ch-title c3">📶 CH3: RSSI</div><div class="label">SIGNAL</div>
                <div id="rssiDb" class="val-small" style="margin-bottom:16px;">--- dBm</div>
                <span id="rssiStat" class="status-huge release" style="font-size:10px;">LIVE</span>
            </div>
        </div>
        <div class="noise-box">
            <div><div class="label" style="text-align:left;">POWER LINE MONITOR</div></div>
            <div id="noise" class="noise-val">--.- mV</div>
        </div>
        <div class="remote-box">
            <div class="label" style="color:#60a5fa;text-align:center;margin-bottom:8px;">REMOTE COMMAND TEST</div>
            <button id="ledBtn" class="btn-led" onclick="toggleRemoteLed()">SEND: LED ON</button>
        </div>
        <div class="db-box">
            <div class="db-title">🛢️ SUPABASE CLOUD ARCHIVE (LATEST 3)</div>
            <div id="dbLogs"><div style="text-align:center;font-size:10px;color:#4b5563;">待機中...</div></div>
        </div>
        <div class="sync-indicator"><span id="syncDot" class="dot"></span><span id="syncText">スキャン中...</span></div>
    </div>
    <script>
        const T_TEL="esp32_01/industrial/telemetry",T_CMD="esp32_01/industrial/command";
        let ledState=false,client=null,globalConfig=null;
        
        // 💡 状態テキストを一括で更新するための便利関数
        function updateStatusText(msg) {
            document.getElementById("syncText").innerText = msg;
        }

        window.addEventListener('DOMContentLoaded',()=>{
            try{
                updateStatusText("URL引数チェック中...🔍");
                const p=new URLSearchParams(window.location.search),k=p.get('key');
                if(!k)throw new Error("URL引数(?key=)無し");
                globalConfig=JSON.parse(atob(k));
                if(!globalConfig.url||!globalConfig.user||!globalConfig.pass)throw new Error("データ不正: 設定不足");
                
                // ⭕ 進行状態表示を組み込んだ先回りフェッチの実行
                fetchSupabaseLogs();

            }catch(e){
                updateStatusText("初期化エラー❌");
                const err=document.getElementById("errMsg");err.style.display="block";err.innerText="⚠️ エラー: "+e.message;
            }
        });

        // 🛢️ Supabase通信関数（ここに進捗ステータス表示を結合）
        function fetchSupabaseLogs(){
            if(!globalConfig||!globalConfig.sb_url||!globalConfig.sb_key)return;
            
            // 💡 状態表示：Supabaseへのフェッチ開始
            updateStatusText("1/2: SUPABASEから過去ログを読込中...📥");
            
            const endpoint=`${globalConfig.sb_url}/rest/v1/esp32_telemetry?select=*&order=created_at.desc&limit=3`;
            fetch(endpoint,{method:'GET',headers:{'apikey':globalConfig.sb_key,'Content-Type':'application/json'}})
            .then(res=>{if(!res.ok)throw new Error("Fetch failed");return res.json();})
            .then(data=>{
                const container=document.getElementById("dbLogs");
                if(data.length===0){container.innerHTML=`<div style="text-align:center;font-size:10px;color:#4b5563;">レコード無し</div>`;}
                else {
                    container.innerHTML=data.map(row=>{
                        const t=new Date(row.created_at).toLocaleTimeString('ja-JP',{hour12:false});
                        return `<div class="log-item">[<span class="log-time">${t}</span>] MAC:${row.mac}<br>SW1:[${row.sw1_stat}/E:${row.sw1_edge}] SW2:[${row.sw2_stat}]<br>ADC:${Number(row.noise_mv).toFixed(1)}mV / ${row.rssi_db}dBm</div>`;
                    }).join('');
                }
                
                // 💡 Supabaseが成功したら、間髪入れずに次の「EMQX接続」フェーズへバトンタッチ！
                startMqttConnection();
            })
            .catch(err=>{
                console.error("Supabase Log Error:",err);
                document.getElementById("dbLogs").innerHTML=`<div style="text-align:center;font-size:10px;color:#ef4444;">データ取得エラー</div>`;
                updateStatusText("SUPABASE読込失敗（EMQX接続をスキップ）❌");
            });
        }

        // 🔌 EMQX接続関数（Supabase完了後に発動する独立ルート）
        function startMqttConnection() {
            // 💡 状態表示：EMQXへのアクセス開始
            updateStatusText("2/2: EMQX CLOUDへログイン中...⚙️");
            
            client=mqtt.connect(`wss://${globalConfig.url}:8084/mqtt`,{
                username:globalConfig.user,password:globalConfig.pass,
                clientId:'web_panel_'+Math.random().toString(16).substr(2,8),
                protocolId:'MQIsdp',protocolVersion:3,connectTimeout:5000,clean:true,rejectUnauthorized:false
            });
            client.on('connect',()=>{
                document.getElementById("syncDot").className="dot online";
                // 💡 状態表示：完全開通（大成功）
                updateStatusText("ALL SYSTEMS ONLINE / 完全開通🟢");
                client.subscribe(T_TEL);
                
                // 開通後は、10秒周期の自動更新タイマーだけをひっそり裏で回す（文字は書き換えない）
                setInterval(silentFetchSupabaseLogs, 10000);
            });
            client.on('close',()=>{
                document.getElementById("syncDot").className="dot";
                updateStatusText("MQTT DISCONNECTED（切断状態）🛑");
            });
            client.on('message',(t,m)=>{
                if(t===T_TEL){
                    try {
                        const r=JSON.parse(m.toString()),rStat=document.getElementById("rssiStat"),rDb=document.getElementById("rssiDb");
                        if(Number(r.rssi_db)===0){
                            rDb.innerText="LAN (有線)";rStat.innerText="ETH LIVE";rStat.className="status-huge pressed";rStat.style.background="#3b82f6";rStat.style.boxShadow="none";
                        }else{
                            rDb.innerText=Number(r.rssi_db)+" dBm";rStat.innerText="SIGNAL OK";rStat.className="status-huge pressed";rStat.style.background="#10b981";
                        }
                        document.getElementById("noise").innerText=Number(r.noise_mv).toFixed(1)+" mV";
                        document.getElementById("noise").style.color=Number(r.noise_mv)>50.0?"#f59e0b":"#10b981";
                        const s1=document.getElementById("sw1Stat");s1.innerText=r.sw1_stat;
                        if(r.sw1_stat==="PUSH"){s1.className="status-huge pressed";s1.style.background="#f59e0b";s1.style.boxShadow="0 0 10px #f59e0b";}
                        else{s1.className="status-huge release";s1.style.background="#374151";s1.style.boxShadow="none";}
                        const s2=document.getElementById("sw2Stat");s2.innerText=r.sw2_stat;
                        if(r.sw2_stat==="PUSH"){s2.className="status-huge pressed";s2.style.background="#06b6d4";s2.style.boxShadow="0 0 10px #06b6d4";}
                        else{s2.className="status-huge release";s2.style.background="#374151";s2.style.boxShadow="none";}
                    }catch(e){console.error(e);}
                }
            });
        }

        // 開通後の定期リフレッシュ用（文字をガチャガチャ変えずに裏でデータを更新する専用関数）
        function silentFetchSupabaseLogs(){
            const endpoint=`${globalConfig.sb_url}/rest/v1/esp32_telemetry?select=*&order=created_at.desc&limit=3`;
            fetch(endpoint,{method:'GET',headers:{'apikey':globalConfig.sb_key,'Content-Type':'application/json'}})
            .then(res=>{if(res.ok) return res.json();})
            .then(data=>{
                if(!data || data.length===0) return;
                document.getElementById("dbLogs").innerHTML=data.map(row=>{
                    const t=new Date(row.created_at).toLocaleTimeString('ja-JP',{hour12:false});
                    return `<div class="log-item">[<span class="log-time">${t}</span>] MAC:${row.mac}<br>SW1:[${row.sw1_stat}/E:${row.sw1_edge}] SW2:[${row.sw2_stat}]<br>ADC:${Number(row.noise_mv).toFixed(1)}mV / ${row.rssi_db}dBm</div>`;
                }).join('');
            }).catch(err=>console.error(err));
        }

        function toggleRemoteLed(){
            ledState=!ledState;const btn=document.getElementById("ledBtn");
            btn.innerText=ledState?"SEND: LED OFF":"SEND: LED ON";btn.className=btn.className.includes("active")?"btn-led":"btn-led active";
            if(client&&client.connected){client.publish(T_CMD,ledState?"1":"0");}else{alert("MQTTサーバーに接続されていません。");}
        }
    </script>
</body>
</html>
